{% extends 'core/base.html' %}
{% block title %}Inscription - E-Learning{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-sm border border-gray-100 p-10 mt-8">
    <h2 class="text-3xl font-black text-center text-gray-900 mb-8 tracking-tight">Créer un compte</h2>
    {% if error %}
        <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm font-medium">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Nom complet</label>
            <input type="text" name="nom" required
                   class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium">
        </div>
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Nom d'utilisateur</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium">
        </div>
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Email</label>
            <input type="email" name="email" required
                   class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium">
        </div>
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Mot de passe</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium">
        </div>
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Rôle</label>
            <select name="role" required
                    class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium appearance-none">
                <option value="etudiant">Étudiant</option>
                <option value="enseignant">Enseignant</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl hover:bg-red-700 transition-all shadow-md hover:shadow-lg transform active:scale-95 mt-4">
            S'inscrire
        </button>
    </form>
    <p class="text-center text-gray-500 text-sm mt-8">
        Déjà un compte ? <a href="{% url 'login' %}" class="text-red-600 font-bold hover:underline">Se connecter</a>
    </p>
</div>
{% endblock %}
