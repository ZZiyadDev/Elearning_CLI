{% extends 'core/base.html' %}
{% block title %}Créer un cours - E-Learning{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-sm border border-gray-100 p-10 mt-8">
    <h2 class="text-3xl font-black text-center text-gray-900 mb-8 tracking-tight">Nouveau cours</h2>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Titre du cours</label>
            <input type="text" name="title" required placeholder="Ex: Maîtrisez Python en 30 jours"
                   class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium">
        </div>
        <button type="submit" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl hover:bg-red-700 transition-all shadow-md hover:shadow-lg transform active:scale-95">
            Créer le cours
        </button>
    </form>
</div>
{% endblock %}
