{% extends 'core/base.html' %}
{% block title %}Ajouter une leçon - {{ course.title }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-sm border border-gray-100 p-10 mt-8">
    <h2 class="text-3xl font-black text-center text-gray-900 mb-8 tracking-tight">Nouvelle leçon</h2>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Titre de la leçon</label>
            <input type="text" name="title" required
                   class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium">
        </div>
        <div>
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Contenu</label>
            <textarea name="content" required rows="10"
                      class="w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 transition-all outline-none text-gray-900 font-medium"></textarea>
        </div>
        <button type="submit" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl hover:bg-red-700 transition-all shadow-md">
            Publier la leçon
        </button>
    </form>
</div>
{% endblock %}
